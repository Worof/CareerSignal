name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include what you expected instead. }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Environment, placeholder: "Browser, local vs Vercel, Node version" }
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal data (names, emails, screenshots) from this report.
          required: true
